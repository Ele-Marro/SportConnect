<!DOCTYPE html>
<html lang="en">
    <head>
        <link rel="stylesheet" href="{{ url_for('static', filename='CssDesign.css') }}">
        <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='button-36.css') }}">
        <header class= "header">
            <div>
        <h1 style="font-size: 30px;">
            Welcome to SportConnect
        </h1>

        <p align="center">
            Connect with other sports enthusiasts!
        </p>
            </div>
        </header>
    </head>
    <body>

          <style>
  body {
    background-image: url('{{ url_for("static", filename="bg.jpg") }}');
    background-size: cover;
    background-repeat: no-repeat;
    background-position: center;
  }

</style>

         <aside>

        <p align="center" class="Menu">Menu</p>
        <a href="{{ url_for('home') }}">
            Home
        </a>

        <a href="{{ url_for('messages') }}">
            Messages
        </a>

        <a href="{{ url_for('createactivity') }}">
            Create Activity
        </a>

        <a href="javascript:void(0)">
            Discover
        </a>

        <a href="{{ url_for('settings') }}">
            Settings
        </a>

        <a href="javascript:void(0)">
            Logout
        </a>

    </aside>


    <!-- MAIN CONTENT -->
    <main>
        <h2>Create Activity</h2>
        
       <form class="activity-form" method="POST">

    <!-- SPORT -->
    <div class="form-field">
        <label for="sport">Sport</label>

        <select id="sport" name="sport">
            <option class value="">Select a sport</option>
            <option value="football">Football</option>
            <option value="basketball">Basketball</option>
            <option value="badminton">Badminton</option>
            <option value="running">Running</option>
        </select>
    </div>


    <!-- ACTIVITY NAME -->
    <div class="form-field">
        <label for="activity-name">Activity Name</label>

        <input
            type="text"
            id="activity-name"
            name="activity_name"
            placeholder="e.g. Casual Basketball Match"
        >
    </div>


    <!-- DATE -->
    <div class="form-field">
        <label for="date">Date</label>

        <input
            type="date"
            id="date"
            name="date"
        >
    </div>


    <!-- TIME -->
    <div class="form-field">
        <label for="time">Time</label>

        <input
            type="time"
            id="time"
            name="time"
        >
    </div>


    <!-- LOCATION -->
    <div class="form-field">
        <label for="location">Location</label>

        <input
            type="text"
            id="location"
            name="location"
            placeholder="e.g. Boschdijk Park, Eindhoven"
        >
    </div>


    <!-- PARTICIPANTS -->
    <div class="form-field">
        <label for="participants">Number of Participants</label>

        <input
            type="number"
            id="participants"
            name="participants"
            placeholder="e.g. 10"
            min="1"
        >
    </div>


    <!-- DESCRIPTION -->
    <div class="form-field full-width">
        <label for="description">Description</label>

        <textarea
            id="description"
            name="description"
            placeholder="Provide a brief description of the activity"
            class="description"
        ></textarea>
    </div>


    <!-- SUBMIT -->
    <button type="submit" class="button-36" text align="center">
        Create Activity
    </button>

</form>
    </main>
    </body>
