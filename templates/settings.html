<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet"
          href="{{ url_for('static', filename='CssDesign.css') }}">

        <link rel="stylesheet"
          href="{{ url_for('static', filename='button-36.css') }}">

        <title>SportConnect - Settings</title>
    </head>
    <body>
        
                <style>
            body {
                background-image: url('{{ url_for("static", filename="bg.jpg") }}');
                background-size: cover;
                background-repeat: no-repeat;
                background-position: center;
            }

            </style>

        <header class="header">
            <div class="header-content">
                <div>
                    <h1>SportConnect Settings</h1>
                </div>
            </div>
        </header>

        <main>
            <!-- Settings content goes here -->
                 <aside>

        <p class="Menu">Menu</p>

        <a href="{{ url_for('home') }}">
            Home
        </a>

        <a href="{{ url_for('messages') }}">
            Messages
        </a>

        <a href="{{ url_for('createactivity') }}">
            Create Activity
        </a>

        <a href="{{ url_for('discover') }}">
            Discover
        </a>

        <a href="{{ url_for('settings') }}">
            Settings
        </a>

        <a href="{{ url_for('logout') }}">
            Logout
        </a>

    </aside>

    
    <!-- main content -->
    
        <h2>Create Activity</h2>
        
       <form class="activity-form" method="POST">

    <!-- sport -->
    <div class="form-field">
        <label for="sport">Username Displayed</label>
        <input
            type: "text"
            id="username"
            name: "username"
        >
    </div>



    <!-- location -->
    <div class="form-field">
        <label for="location">City</label>

        <input
            type="text"
            id="city"
            name="city"
            placeholder="e.g. Eindhoven"
        >
    </div>


    <!-- participants -->
    <div class="form-field">
        <label for="participants">Liked Sports</label>

        <input
            type="text"
            id="likedsports"
            name="likedsports"
   
        >
    </div>


    <!-- submit -->
    <button type="submit" class="button-36" text align="center">
        Save Changes
    </button>

</form>
    
        </main>
    </body>
</html>
