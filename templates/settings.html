<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet"
          href="{{ url_for('static', filename='CssDesign.css') }}">

        <link rel="stylesheet"
          href="{{ url_for('static', filename='button-36.css') }}">

        <title>SportConnect - Settings</title>
    </head>
    <body>
        
                <style>
            body {
                background-image: url('{{ url_for("static", filename="bg.jpg") }}');
                background-size: cover;
                background-repeat: no-repeat;
                background-position: center;
            }

            </style>

        <header class="header">
            <div style="width: 50px;"></div>
                    <img style="width: 100px; height:100px;" src="{{ url_for('static', filename='logonobg.png') }}" alt="logo" class="center"> 
            <div style="width: 50px;"></div>
            <div class="header-content">
                <div style="width: 50px;"></div>
                <div> 
                    <h1>SportConnect Settings</h1>
                </div>
            </div>
        </header>

        <main>
            <!-- Settings content goes here -->
                 <aside>

        <div style="height: 50px;"></div>

        <a href="{{ url_for('home') }}">
            Home
        </a>

        <a href="{{ url_for('messages') }}">
            Messages
        </a>

        <a href="{{ url_for('createactivity') }}">
            Create Activity
        </a>

        <a href="{{ url_for('discover') }}">
            Discover
        </a>

        <a href="{{ url_for('joined') }}">
            Joined Activities
        </a>

        <a href="{{ url_for('settings') }}">
            Settings
        </a>

        <a href="{{ url_for('logout') }}">
            Logout
        </a>

    </aside>

    
    <!-- main content -->
    
        <h2>Your information</h2>

        {% if error %}
            <p>{{ error }}</p>
        {% endif %}
        
       <form class="activity-form" method="POST">


    <!-- sport -->
    <div class="form-field">
        <label for="sport">Username Displayed</label>
        <input
            type="text"
            id="username"
            name="username"
            value="{{ settings['username'] }}"
            required
        >
    </div>


    <!-- participants -->
    <div class="form-field">
        <label for="participants">Liked Sports</label>

        <input
            type="text"
            id="likedsports"
            name="likedsports"
            placeholder="e.g. Football, basketball"
   
        >
    </div>


    <!-- submit -->
    <button type="submit" class="button-36" text align="center">
        Save Changes
    </button>

</form>
    
        </main>
    </body>
</html>
