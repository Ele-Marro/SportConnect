<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Create Account</title>
        <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='createaccstyle.css') }}">
    </head>
    <body>
        <div class="main">
            <div class="form-container">
                <h1>Create Account</h1>
<form method="POST" action="{{ url_for('createaccount') }}">

    <input type="text"
           id="username"
           name="username"
           placeholder="Username"
           required>

    <input type="email"
           id="email"
           name="email"
           placeholder="Email"
           required>

    <input type="password"
           id="password"
           name="password"
           placeholder="Password"
           required>

    <button type="submit">Create Account</button>

</form>
            </div>
        </div>
    </body>
</html>
